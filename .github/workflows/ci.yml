name: CI

"on":
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  GO_VERSION: "1.24"

jobs:
  lint:
    runs-on: openmuse-linux-checks
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "https://gitea.pizzly-tarpon.ts.net/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Set up Go
        run: |
          if ! command -v go >/dev/null 2>&1; then
            curl -sL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -xz -C /tmp
            echo "/tmp/go/bin" >> "${GITHUB_PATH}"
          fi
          go version

      - name: Lint
        run: make lint

  test:
    runs-on: openmuse-linux-checks
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "https://gitea.pizzly-tarpon.ts.net/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Set up Go
        run: |
          if ! command -v go >/dev/null 2>&1; then
            curl -sL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -xz -C /tmp
            echo "/tmp/go/bin" >> "${GITHUB_PATH}"
          fi
          go version

      - name: Test
        run: make test

  test-race:
    runs-on: openmuse-linux-checks
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "https://gitea.pizzly-tarpon.ts.net/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Set up Go
        run: |
          if ! command -v go >/dev/null 2>&1; then
            curl -sL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -xz -C /tmp
            echo "/tmp/go/bin" >> "${GITHUB_PATH}"
          fi
          go version

      - name: Test with race detector
        run: make test-race

  cyclo-check:
    runs-on: openmuse-linux-checks
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "https://gitea.pizzly-tarpon.ts.net/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Set up Go
        run: |
          if ! command -v go >/dev/null 2>&1; then
            curl -sL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -xz -C /tmp
            echo "/tmp/go/bin" >> "${GITHUB_PATH}"
          fi
          go version

      - name: Dogfood cyclo on itself
        run: make cyclo-check

  quality-gate:
    runs-on: openmuse-linux-checks
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "https://gitea.pizzly-tarpon.ts.net/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Set up Go
        run: |
          if ! command -v go >/dev/null 2>&1; then
            curl -sL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -xz -C /tmp
            echo "/tmp/go/bin" >> "${GITHUB_PATH}"
          fi
          go version

      - name: Quality gate
        run: make quality-gate
